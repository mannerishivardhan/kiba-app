name: kiba_app
description: "Kiba – Smart Attendance & Task Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────────────────────
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.5

  # ── State Management ───────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── UI & Styling ───────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  gap: ^3.0.1

  # ── Location ───────────────────────────────────────────────────────────────
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # ── Utilities ──────────────────────────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  logger: ^2.5.0
  connectivity_plus: ^6.1.4

  # ── Export & Sharing ───────────────────────────────────────────────────────
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

  # ── Icons ──────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  json_serializable: ^6.9.4
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
